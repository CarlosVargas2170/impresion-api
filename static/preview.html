<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista previa de gafete | Nexus</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17201f;
      background: #eef1ef;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 32px;
      color: #fff;
      background: #17201f;
      border-bottom: 4px solid #e8bf45;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .topbar span:last-child {
      color: #b9c6c3;
      font-size: 13px;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 48px;
      align-items: start;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #596663;
      font-size: 14px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 20px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #32403d;
      font-size: 13px;
      font-weight: 700;
    }

    .full { grid-column: 1 / -1; }

    input, select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      color: #17201f;
      background: #fff;
      border: 1px solid #bcc7c4;
      border-radius: 5px;
      outline: none;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #087d6b;
      box-shadow: 0 0 0 3px rgb(8 125 107 / 15%);
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 44px;
      margin-top: 6px;
    }

    button {
      min-height: 44px;
      padding: 10px 18px;
      color: #fff;
      background: #087d6b;
      border: 0;
      border-radius: 5px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: #066957; }
    button:disabled { cursor: wait; opacity: .65; }

    button.secondary {
      color: #17201f;
      background: #dce4e1;
    }

    button.secondary:hover { background: #cbd6d2; }

    #status {
      min-width: 0;
      color: #53615e;
      font-size: 13px;
    }

    #status.error { color: #b42318; }
    #status.success { color: #067647; }

    .preview-area {
      position: sticky;
      top: 28px;
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .size-controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .size-controls label {
      font-size: 11px;
      text-transform: uppercase;
    }

    .size-controls input { min-height: 38px; }

    .preview-label {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: #596663;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sheet-summary {
      width: 100%;
      margin-top: -4px;
      color: #596663;
      font-size: 12px;
      text-align: right;
    }

    .paper {
      width: min(100%, 360px);
      aspect-ratio: var(--label-width, 58) / var(--label-height, 30);
      margin: 0;
      padding: 30px 24px;
      overflow: hidden;
      color: #111;
      background: #fff;
      border-top: 1px solid #d4d8d6;
      box-shadow: 0 14px 36px rgb(23 32 31 / 16%);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .printed-name {
      font-size: 38px;
      line-height: 1.05;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .printed-field::before {
      content: attr(data-label);
      display: block;
      margin-bottom: 4px;
      color: #6b7774;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
      text-transform: uppercase;
    }

    .printed-surnames {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .printed-company {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .printed-job-title {
      margin-top: 6px;
      font-size: 17px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .printed-email {
      margin-top: 24px;
      color: #53615e;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .printed-qr {
      display: grid;
      justify-items: center;
      margin-top: 14px;
      color: #41504d;
      font-size: 10px;
      text-decoration: none;
    }

    .printed-qr img {
      width: 104px;
      height: 104px;
      image-rendering: pixelated;
    }

    @media (max-width: 820px) {
      .topbar { padding: 0 20px; }
      .topbar span:last-child { display: none; }
      main {
        width: min(100% - 28px, 620px);
        grid-template-columns: 1fr;
        gap: 36px;
        padding-top: 24px;
      }
      .preview-area { position: static; }
    }

    @media (max-width: 520px) {
      form { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .actions { grid-column: auto; align-items: flex-start; flex-direction: column; }
      .paper { padding: 16px 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">NEXUS</span>
    <span>Servicio local de impresion</span>
  </header>

  <main>
    <section>
      <h1>Vista previa de impresion</h1>
      <p class="subtitle">Completa los datos y revisa el resultado antes de enviarlo.</p>

      <form id="formulario">
        <label>
          Nombre
          <input name="first_name" value="Ana" maxlength="100" required autocomplete="given-name">
        </label>
        <label>
          Apellido paterno
          <input name="paternal_surname" value="Perez" maxlength="100" required autocomplete="family-name">
        </label>
        <label>
          Apellido materno (opcional)
          <input name="maternal_surname" value="Lopez" maxlength="100">
        </label>
        <label>
          Empresa (opcional)
          <input name="company" value="Nexus" maxlength="100" autocomplete="organization">
        </label>
        <label>
          Cargo (opcional)
          <input name="job_title" value="Gerente comercial" maxlength="100" autocomplete="organization-title">
        </label>
        <label>
          Correo (opcional)
          <input name="email" type="email" value="ana.perez@ejemplo.com" autocomplete="email">
        </label>
        <label class="full">
          Descripcion (obligatoria para VIP)
          <textarea name="description" maxlength="500">Invitada VIP</textarea>
        </label>
        <label>
          Prefijo telefonico (opcional)
          <input name="phone_prefix" value="+591" maxlength="5" pattern="\+[1-9][0-9]{0,3}" inputmode="tel" placeholder="+591">
        </label>
        <label>
          Numero telefonico (opcional)
          <input name="phone_number" value="71234567" minlength="6" maxlength="15" pattern="[0-9]{6,15}" inputmode="numeric" autocomplete="tel-national">
        </label>
        <label class="full">
          Fecha y hora de consentimiento (opcional)
          <input name="consent_at" type="datetime-local">
        </label>
        <label class="full">
          Impresora
          <select name="printer_name" id="printer">
            <option value="">Impresora predeterminada</option>
          </select>
        </label>
        <div class="actions">
          <button id="saveButton" type="button">Guardar y generar QR</button>
          <button id="printButton" class="secondary" type="submit">Imprimir gafete</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <aside class="preview-area" aria-label="Vista previa del papel">
      <div class="preview-label"><span>Formulario</span><span id="sizeLabel">85 × 100 mm</span></div>
      <div class="sheet-summary">Hoja completa: 109 × 306 mm · 3 formularios</div>
      <div class="size-controls">
        <label>Ancho (mm)<input id="labelWidth" type="number" value="85" min="20" max="150" step="1"></label>
        <label>Alto por formulario (mm)<input id="labelHeight" type="number" value="100" min="15" max="150" step="1"></label>
      </div>
      <div id="paper" class="paper">
        <div id="printedName" class="printed-name printed-field" data-label="Nombre">Ana</div>
        <div id="printedSurnames" class="printed-surnames printed-field" data-label="Apellidos">Perez Lopez</div>
        <div id="printedCompany" class="printed-company printed-field" data-label="Empresa">Nexus</div>
        <div id="printedJobTitle" class="printed-job-title printed-field" data-label="Cargo">Gerente comercial</div>
        <div id="printedEmail" class="printed-email printed-field" data-label="Correo">ana.perez@ejemplo.com</div>
        <a id="printedQr" class="printed-qr" href="#" target="_blank" rel="noreferrer" hidden>
          <img id="qrImage" alt="Codigo QR del formulario">
        </a>
      </div>
    </aside>
  </main>

  <script>
    const form = document.querySelector("#formulario");
    const paper = document.querySelector("#paper");
    const status = document.querySelector("#status");
    const saveButton = document.querySelector("#saveButton");
    const printButton = document.querySelector("#printButton");
    const printer = document.querySelector("#printer");
    const printedName = document.querySelector("#printedName");
    const printedSurnames = document.querySelector("#printedSurnames");
    const printedCompany = document.querySelector("#printedCompany");
    const printedJobTitle = document.querySelector("#printedJobTitle");
    const printedEmail = document.querySelector("#printedEmail");
    const printedQr = document.querySelector("#printedQr");
    const qrImage = document.querySelector("#qrImage");
    const labelWidth = document.querySelector("#labelWidth");
    const labelHeight = document.querySelector("#labelHeight");
    const sizeLabel = document.querySelector("#sizeLabel");
    let previewTimer;

    function payload() {
      const data = Object.fromEntries(new FormData(form).entries());
      for (const key of [
        "maternal_surname", "description", "company", "job_title",
        "phone_prefix", "phone_number", "email", "consent_at", "printer_name"
      ]) {
        if (!data[key]) delete data[key];
      }
      return data;
    }

    async function updatePreview() {
      if (!form.checkValidity()) return;
      try {
        const response = await fetch("/preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload())
        });
        if (!response.ok) throw new Error("Datos incompletos o invalidos");
        await response.text();
        const data = payload();
        printedName.textContent = data.first_name;
        printedName.style.fontSize = data.first_name.length > 20
          ? "26px"
          : data.first_name.length > 14 ? "32px" : "38px";
        printedSurnames.textContent = [data.paternal_surname, data.maternal_surname]
          .filter(Boolean).join(" ");
        printedCompany.textContent = data.company || "";
        printedCompany.hidden = !data.company;
        printedJobTitle.textContent = data.job_title || "";
        printedJobTitle.hidden = !data.job_title;
        printedEmail.textContent = data.email || "";
        printedEmail.hidden = !data.email;
      } catch (error) {
        status.className = "error";
        status.textContent = "No se pudo generar la vista previa.";
      }
    }

    function updateSize() {
      const width = Math.max(20, Number(labelWidth.value) || 85);
      const height = Math.max(15, Number(labelHeight.value) || 100);
      paper.style.setProperty("--label-width", width);
      paper.style.setProperty("--label-height", height);
      sizeLabel.textContent = `${width} × ${height} mm`;
    }

    async function loadPrinters() {
      try {
        const response = await fetch("/printers");
        if (!response.ok) return;
        const data = await response.json();
        printer.options[0].textContent = data.default
          ? `Predeterminada: ${data.default}`
          : "Impresora predeterminada";
        for (const name of data.printers) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          printer.append(option);
        }
      } catch (_) {
        printer.options[0].textContent = "No se pudieron consultar las impresoras";
      }
    }

    form.addEventListener("input", () => {
      printedQr.hidden = true;
      clearTimeout(previewTimer);
      previewTimer = setTimeout(updatePreview, 180);
    });

    labelWidth.addEventListener("input", updateSize);
    labelHeight.addEventListener("input", updateSize);

    saveButton.addEventListener("click", async () => {
      if (!form.reportValidity()) return;
      saveButton.disabled = true;
      status.className = "";
      status.textContent = "Guardando...";
      try {
        const response = await fetch("/forms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload())
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "No se pudo guardar");
        qrImage.src = `${data.qr_url}?v=${Date.now()}`;
        printedQr.href = data.view_url;
        printedQr.hidden = false;
        status.className = "success";
        status.textContent = "Formulario recibido y QR generado";
      } catch (error) {
        status.className = "error";
        status.textContent = error.message;
      } finally {
        saveButton.disabled = false;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      printButton.disabled = true;
      status.className = "";
      status.textContent = "Enviando...";
      try {
        const response = await fetch("/print", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload())
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "No se pudo imprimir");
        status.className = "success";
        status.textContent = `Enviado a ${data.printer}`;
      } catch (error) {
        status.className = "error";
        status.textContent = error.message;
      } finally {
        printButton.disabled = false;
      }
    });

    loadPrinters();
    updateSize();
    updatePreview();
  </script>
</body>
</html>
